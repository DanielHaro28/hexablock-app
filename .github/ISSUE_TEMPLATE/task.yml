name: Task
description: Setup, documentation or delivery work that is not a user story
title: "XX-00 · "
labels: ["type:task"]
projects: ["DanielHaro28/1"]
body:
  - type: input
    id: ref
    attributes:
      label: Pending item ID
      placeholder: "G-03 · docs/PENDIENTES.md"
  - type: textarea
    id: what
    attributes:
      label: What has to be done
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] ..."
  - type: input
    id: estimate
    attributes:
      label: Estimate (hours)
