# Signed release APK (TEC-04, SEC-MOB-05, SEC-MOB-07, D-75).
# Pushing a tag `v<major>.<minor>.<patch>` builds the APK with the keystore of
# the `release` environment and publishes it in a GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Its secrets are only available to tags v* (environment protection).
    environment: release
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Check the tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags look like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag points to a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - run: flutter pub get --enforce-lockfile

      - name: Write the signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no keystore (SEC-MOB-07)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Release APK (obfuscated, SEC-MOB-05)
        working-directory: app
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: >-
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols
          --build-name="${TAG#v}" --build-number="$BUILD_NUMBER"

      - name: Remove the signing files
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

      - name: The APK is not signed with the debug key
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          cert=$(keytool -printcert -jarfile "$apk")
          printf '%s\n' "$cert" | grep -E 'Owner|SHA256:'
          if printf '%s' "$cert" | grep -q 'CN=Android Debug'; then
            echo "::error::The release APK is signed with the debug key"
            exit 1
          fi

      - name: Keep the symbols to read obfuscated stack traces
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ github.ref_name }}
          path: app/build/symbols
          retention-days: 90

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="hexablock-$TAG.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          gh release create "$TAG" "$name" "$name.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
