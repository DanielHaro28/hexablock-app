# Temporary: verifies the T-03 skeleton and prints the files that only
# Flutter can generate (android/, .metadata, pubspec.lock). Never merged.
name: scratch
on:
  push:
    branches: [ci/t-03-scratch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build apk --debug
