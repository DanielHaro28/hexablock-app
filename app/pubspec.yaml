name: hexablock_app
description: "HexaBlock Suite mobile app. Layers 3 (adapters) and 4 (frameworks)."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# The app is the outer layer and may depend on every package (ARQ-01-APP §3.1).
# Third-party libraries are added by the story that needs them (SEC-AGT-04).
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.5.0
  get_it: ^9.3.0
  hexa_application:
    path: ../packages/hexa_application
  hexa_engine:
    path: ../packages/hexa_engine
  hexa_topologies:
    path: ../packages/hexa_topologies
  hexa_variants:
    path: ../packages/hexa_variants
  intl: ^0.20.3
  material_ui: ^1.11.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  hexa_test_support:
    path: ../packages/hexa_test_support

flutter:
  # Generates AppLocalizations from assets/l10n (l10n.yaml, ADR-001).
  generate: true
  assets:
    - assets/config/
    # Design system SVGs (D-151), copied from the design system.
    - assets/icons/
    - assets/games/
    - assets/mascot/
  fonts:
    # Bundled, so they work offline (D-146). SIL OFL 1.1: assets/fonts/*-OFL.txt.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
