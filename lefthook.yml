# Git hooks (ADR-001 §2.4, D-123). `npm ci` installs them: lefthook's
# postinstall runs `lefthook install` (it skips that step when CI is set).
commit-msg:
  commands:
    commitlint:
      # Quoted: in a git worktree the message file is an absolute path under
      # the main clone's .git, which can contain spaces.
      run: npx --no-install commitlint --edit "{1}"
